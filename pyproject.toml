[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pm-latency"
version = "0.6.1"
description = "Short-horizon Polymarket CLOB tooling (latency strategy work in progress)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "py-clob-client>=0.34.0,<0.35",
  "python-dotenv>=1.0.0",
  "websockets>=13.0,<15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
pm-runner = "pm_latency.ops.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["pm_latency"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
